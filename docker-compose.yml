services:
  # Desarrollo: Vite dev server con hot reload
  dev:
    build:
      context: .
      target: dev
    ports:
      - "3001:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development

  # Producción: Build + Nginx
  prod:
    build:
      context: .
      target: prod
    ports:
      - "80:80"
    profiles:
      - production

volumes:
  node_modules:
